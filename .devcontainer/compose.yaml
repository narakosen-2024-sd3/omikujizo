name: omikujizo-dev
services:
  app:
    build:
      context: ../app
      target: development
    command: sleep infinity
    volumes:
      - type: bind
        source: ../app
        target: /workspace
    devices:
      # Enable Camera control
      - "/dev/video0"
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=$DISPLAY
